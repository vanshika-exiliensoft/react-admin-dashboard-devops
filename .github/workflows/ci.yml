
name: React Dashboard CI/CD

on:
  push:
    branches:
      - main
      - feature/jenkins-terraform-deployment

  pull_request:
    branches:
      - main
      - feature/jenkins-terraform-deployment

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: react-admin-dashboard-vanshika-2026
  CLOUDFRONT_DISTRIBUTION_ID: ES5IBDMCJTNW0

jobs:
  frontend-ci:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit
        continue-on-error: true

      - name: Run ESLint
        run: npm run lint

      - name: Build React Application
        run: npm run build

      - name: Verify Build Output
        run: test -f dist/index.html

      - name: Upload Production Build
        uses: actions/upload-artifact@v4
        with:
          name: react-dashboard-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  terraform-validation:
    name: Terraform Format and Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/infrastructure

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform Configuration
        run: terraform validate -no-color

  deploy:
    name: Deploy to AWS
    needs:
      - frontend-ci
      - terraform-validation

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feature/jenkins-terraform-deployment')

    runs-on: ubuntu-latest

    steps:
      - name: Download Production Build
        uses: actions/download-artifact@v4
        with:
          name: react-dashboard-dist
          path: dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
          allowed-account-ids: "864899835094"

      - name: Verify CloudFront Distribution
        shell: bash
        run: |
          aws cloudfront wait distribution-deployed \
            --id "$CLOUDFRONT_DISTRIBUTION_ID"

          ENABLED=$(aws cloudfront get-distribution \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Enabled' \
            --output text)

          if [ "$ENABLED" != "True" ]; then
            echo "CloudFront distribution is disabled."
            exit 1
          fi

      - name: Deploy Build to S3
        shell: bash
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" --delete

      - name: Invalidate CloudFront Cache
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
